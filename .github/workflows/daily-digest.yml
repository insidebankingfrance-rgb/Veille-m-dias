name: Daily finance digest

on:
  # Déclencheur PRINCIPAL — cron-job.org (fiable, gratuit) poste à 7h Paris pile
  # sur POST /repos/.../dispatches avec {"event_type":"daily-digest"}.
  repository_dispatch:
    types: [daily-digest]
  schedule:
    # Filet de sécurité si cron-job.org rate un tir. 7h UTC = 9h Paris (été) /
    # 8h Paris (hiver), soit ~1-2h après le déclencheur principal.
    # Grâce au dedup via cache, aucun risque de doublon avec l'envoi de 7h.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Bypass Paris-hour window guard AND same-day dedup"
        type: boolean
        default: true

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compute today's Paris date
        id: date
        run: echo "value=$(TZ=Europe/Paris date +%F)" >> $GITHUB_OUTPUT

      - name: Restore today's send marker (dedup)
        id: dedup
        uses: actions/cache/restore@v4
        with:
          path: .sent-marker
          key: veille-sent-${{ steps.date.outputs.value }}

      - name: Compute should_run
        id: gate
        run: |
          if [ "${{ steps.dedup.outputs.cache-hit }}" = "true" ] && [ "${{ inputs.force_send }}" != "true" ]; then
            echo "run=false" >> $GITHUB_OUTPUT
            echo "[dedup] Marker cache-hit for ${{ steps.date.outputs.value }} — email already sent today. Skipping."
          else
            echo "run=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Send daily digest
        if: steps.gate.outputs.run == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_RECIPIENT: ${{ vars.DIGEST_RECIPIENT || 'inside.banking.france@gmail.com' }}
          DIGEST_SENDER: ${{ vars.DIGEST_SENDER }}
          FORCE_SEND: ${{ inputs.force_send && 'true' || 'false' }}
        run: python -m src.main

      - name: Save send marker (only if email was actually sent)
        if: steps.gate.outputs.run == 'true' && hashFiles('.sent-marker') != ''
        uses: actions/cache/save@v4
        with:
          path: .sent-marker
          key: veille-sent-${{ steps.date.outputs.value }}
