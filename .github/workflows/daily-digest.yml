name: Daily finance digest

on:
  schedule:
    # 5h UTC = 7h Paris (CEST, été) | 5h UTC = 6h Paris (CET, hiver, 1h en avance acceptable).
    # Les crons GitHub Actions sont best-effort et peuvent être retardés de 4-6h ;
    # le script accepte tout déclenchement entre 5h et 14h Paris pour qu'un cron
    # tardif envoie quand même l'email du matin (plutôt qu'un envoi silencieusement sauté).
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Bypass the 7h-Paris guard and send immediately"
        type: boolean
        default: true

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send daily digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_RECIPIENT: ${{ vars.DIGEST_RECIPIENT || 'inside.banking.france@gmail.com' }}
          DIGEST_SENDER: ${{ vars.DIGEST_SENDER }}
          FORCE_SEND: ${{ inputs.force_send && 'true' || 'false' }}
        run: python -m src.main
